[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 301 Redirect www to non-www canonical URL
[[redirects]]
  from = "https://www.sandeshkenchugundiportfolio.netlify.app/*"
  to = "https://sandeshkenchugundiportfolio.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.sandeshkenchugundiportfolio.netlify.app/*"
  to = "https://sandeshkenchugundiportfolio.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://sandeshkenchugundiportfolio.netlify.app/*"
  to = "https://sandeshkenchugundiportfolio.netlify.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Sandesh-Kenchugundi-Resume.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline; filename=\"Sandesh-Kenchugundi-Resume.pdf\""
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xsl"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
